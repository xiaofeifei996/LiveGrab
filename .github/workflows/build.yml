name: Build LiveGrab IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          brew install xcodegen || true
          xcodegen --version

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          xcodebuild \
            -project LiveGrab.xcodeproj \
            -scheme LiveGrab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Verify and package IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/LiveGrab.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist" | grep -x iPhoneOS
          xcrun lipo -archs "$APP/LiveGrab"
          test ! -e "$APP/embedded.mobileprovision"
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload LiveGrab-unsigned.ipa
          unzip -t LiveGrab-unsigned.ipa > /dev/null
          shasum -a 256 LiveGrab-unsigned.ipa > LiveGrab-unsigned.ipa.sha256
          ls -lh LiveGrab-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LiveGrab-unsigned-ipa
          path: |
            LiveGrab-unsigned.ipa
            LiveGrab-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
